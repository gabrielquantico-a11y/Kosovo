
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KOSOVO 2D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10101b;color:white;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:fixed;top:10px;left:12px;font-size:15px;font-weight:bold;text-shadow:2px 2px #000}
#controls{position:fixed;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.group{display:flex;gap:12px}
button{pointer-events:auto;border:2px solid #fff;background:#47326c;color:white;border-radius:15px;padding:15px 21px;font-size:22px;font-weight:bold;touch-action:none}
#jump{background:#7b459b}
#menu{position:fixed;inset:0;background:#080914dc;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}
#panel{background:#29213c;border:2px solid #ae91e0;border-radius:20px;padding:25px;max-width:420px}
#panel p{line-height:1.6}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">KOSOVO 2D</div>
<div id="controls">
<div class="group">
<button data-key="left">◀</button>
<button data-key="right">▶</button>
</div>
<button id="jump" data-key="jump">PULAR</button>
</div>
<div id="menu">
<div id="panel">
<h1 id="title">🎮 KOSOVO 2D</h1>
<p id="description">Ajude Bolovo a atravessar quatro fases!<br>1. Frigideiras<br>2. Espátulas<br>3. Lagartos e Zovinho<br>4. Futebol americano</p>
<button id="start">JOGAR</button>
</div>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const hud=document.getElementById("hud");
const menu=document.getElementById("menu");
const keys={left:false,right:false,jump:false};
const names=["","Floresta das Frigideiras","Halloween das Espátulas","Selva de Zovinho","Estádio dos Monstros"];
let phase=1,playing=false,lives=3,score=0,camera=0,clock=0,inv=0;
let W=800,H=450;
const hero={x:45,y:280,vx:0,vy:0,w:32,h:48,ground:false,face:1};
const zovinho={x:5,y:300,face:1};
let trail=[],enemies=[],coins=[];
const holes=[[410,535],[820,955],[1220,1355],[1630,1765]];
function resize(){
canvas.width=innerWidth*devicePixelRatio;
canvas.height=innerHeight*devicePixelRatio;
W=innerWidth;H=innerHeight;
}
addEventListener("resize",resize);resize();
function show(title,description,button){
playing=false;
document.getElementById("title").textContent=title;
document.getElementById("description").innerHTML=description;
document.getElementById("start").textContent=button;
menu.style.display="flex";
}
function reset(n){
phase=n;lives=3;score=0;inv=0;camera=0;
hero.x=45;hero.y=270;hero.vx=0;hero.vy=0;
zovinho.x=5;zovinho.y=300;trail=[];
coins=[240,610,1020,1430,1860].map(x=>({x,y:280,taken:false}));
enemies=[500,900,1290,1710].map((x,i)=>({x,base:x,i}));
updateHud();
}
function updateHud(){
hud.textContent="KOSOVO 2D | Fase "+phase+" | "+names[phase]+" | ⭐ "+score+"/5 | ♥ "+lives;
}
document.getElementById("start").onclick=()=>{
if(phase===0)reset(1);
playing=true;menu.style.display="none";
};
document.querySelectorAll("[data-key]").forEach(b=>{
const k=b.dataset.key;
b.addEventListener("pointerdown",e=>{
e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true;
});
["pointerup","pointercancel","lostpointercapture"].forEach(ev=>
b.addEventListener(ev,()=>keys[k]=false));
});
const keyboard={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",Space:"jump",ArrowUp:"jump"};
addEventListener("keydown",e=>{
if(keyboard[e.code]){e.preventDefault();keys[keyboard[e.code]]=true;}
});
addEventListener("keyup",e=>{if(keyboard[e.code])keys[keyboard[e.code]]=false;});
function platforms(){
const p=[{x:0,y:385,w:2100},{x:250,y:315,w:135},{x:610,y:315,w:135},{x:1010,y:315,w:135},{x:1410,y:315,w:135},{x:1810,y:315,w:135}];
if(phase===3){
p[0]={x:0,y:385,w:410};
p.push({x:535,y:385,w:285},{x:955,y:385,w:265},{x:1355,y:385,w:275},{x:1765,y:385,w:335});
}
return p;
}
function hit(){
if(inv>0)return;
lives--;inv=1.5;
hero.x=Math.max(45,hero.x-130);
hero.y=180;hero.vy=0;
updateHud();
if(lives<=0){
reset(phase);
show("💀 Fim de jogo","Bolovo perdeu suas três vidas.","RECOMEÇAR");
}
}
function update(dt){
clock+=dt;
if(!playing)return;
inv=Math.max(0,inv-dt);
let dir=Number(keys.right)-Number(keys.left);
hero.vx=dir*225;
if(dir)hero.face=dir;
if(keys.jump&&hero.ground){hero.vy=-525;hero.ground=false;}
hero.vy+=1250*dt;
hero.x=Math.max(0,Math.min(2060,hero.x+hero.vx*dt));
const oldBottom=hero.y+hero.h;
hero.y+=hero.vy*dt;
hero.ground=false;
for(const p of platforms()){
if(hero.vy>=0&&hero.x+hero.w>p.x+4&&hero.x<p.x+p.w-4&&oldBottom<=p.y+10&&hero.y+hero.h>=p.y){
hero.y=p.y-hero.h;hero.vy=0;hero.ground=true;
}
}
if(hero.y>650)hit();
for(const c of coins){
if(!c.taken&&Math.abs(hero.x-c.x)<30&&Math.abs(hero.y-c.y)<55){
c.taken=true;score++;updateHud();
}
}
for(const e of enemies){
e.x=e.base+Math.sin(clock*1.7+e.i)*65;
if(Math.abs(hero.x+16-e.x)<31&&Math.abs(hero.y+25-350)<45)hit();
}
if(phase===3){
trail.push({x:hero.x,y:hero.y,face:hero.face});
if(trail.length>22){
const a=trail.shift();
zovinho.x+=(a.x-43-zovinho.x)*Math.min(1,dt*12);
zovinho.y+=(a.y+18-zovinho.y)*Math.min(1,dt*12);
zovinho.face=a.face;
}
}
if(hero.x>2015&&score===5){
if(phase<4){
const n=phase+1;reset(n);
show("FASE "+n+" — "+names[n],
n===3?"Zovinho seguirá Bolovo! Cuidado com os poços, lagartos e copos!":"Colete cinco estrelas e alcance o portal.",
"CONTINUAR");
}else{
phase=0;
show("🏆 BOLOVO VENCEU!","Você completou as quatro fases do KOSOVO 2D!","JOGAR NOVAMENTE");
}
}
camera=Math.max(0,Math.min(1300,hero.x-220));
}
function circle(x,y,r,color){
ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function egg(x,y,size,brown,diaper){
ctx.save();ctx.translate(x,y);
ctx.fillStyle=brown?"#a36c3d":"#b38b62";
ctx.beginPath();ctx.ellipse(0,0,size*.72,size,0,0,Math.PI*2);ctx.fill();
if(!brown){
for(let i=0;i<90;i++){
let a=i*2.4,r=Math.sqrt(i/90);
let px=Math.cos(a)*size*.7*r,py=Math.sin(a)*size*r;
ctx.strokeStyle=i%2?"#c8a27b":"#765239";
ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px+Math.cos(a)*5,py+Math.sin(a)*5);ctx.stroke();
}
}
if(diaper){
ctx.fillStyle="white";ctx.fillRect(-size*.7,size*.15,size*1.4,size*.7);
}else{
ctx.strokeStyle="#a58c75";ctx.lineWidth=5;ctx.beginPath();
ctx.moveTo(-size*.4,size*.7);ctx.lineTo(-size*.5,size*1.15);
ctx.moveTo(size*.4,size*.7);ctx.lineTo(size*.5,size*1.15);
ctx.moveTo(-size*.6,-2);ctx.lineTo(-size,8);
ctx.moveTo(size*.6,-2);ctx.lineTo(size,8);ctx.stroke();
circle(-size,8,5,"white");circle(size,8,5,"white");
ctx.fillStyle="white";ctx.fillRect(-size*.9,size*1.08,size*.7,7);
ctx.fillRect(size*.2,size*1.08,size*.7,7);
}
ctx.strokeStyle="#171321";ctx.lineWidth=2.5;ctx.beginPath();
ctx.arc(-size*.28,-size*.25,size*.28,0,7);
ctx.arc(size*.28,-size*.25,size*.28,0,7);
ctx.moveTo(-2,-size*.25);ctx.lineTo(2,-size*.25);ctx.stroke();
circle(-size*.25,-size*.25,2,"black");
circle(size*.32,-size*.25,2,"black");
ctx.restore();
}
function enemy(e){
const x=e.x,y=351+Math.sin(clock*3+e.i)*5;
ctx.save();ctx.translate(x,y);
if(phase===1){
ctx.strokeStyle="#777";ctx.lineWidth=10;
ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(46,-10);ctx.stroke();
circle(0,0,22,"#626b79");circle(0,0,16,"#a0a8b3");
}else if(phase===2){
ctx.fillStyle="#b6c5d0";ctx.fillRect(-15,-24,30,29);
ctx.fillStyle="#78533e";ctx.fillRect(-5,5,10,35);
}else if(phase===3){
ctx.fillStyle="#428e43";
ctx.beginPath();ctx.ellipse(0,5,25,13,0,0,7);ctx.fill();
ctx.beginPath();ctx.moveTo(17,5);ctx.lineTo(45,15);ctx.lineTo(25,12);ctx.fill();
circle(-18,-3,12,"#4ca34e");
}else{
ctx.fillStyle="#c4434a";ctx.fillRect(-23,-13,46,30);
ctx.fillStyle="#f2d2a8";ctx.fillRect(-14,-36,28,23);
ctx.fillStyle="#8b9bb0";ctx.fillRect(-18,-39,36,10);
ctx.fillStyle="#2d3246";ctx.fillRect(-20,17,14,18);ctx.fillRect(6,17,14,18);
}
circle(-7,-5,3,"#16121a");circle(7,-5,3,"#16121a");
ctx.restore();
}
function draw(){
ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
ctx.clearRect(0,0,W,H);
ctx.fillStyle=["","#172b27","#321b40","#163b25","#192b42"][phase]||"#172b27";
ctx.fillRect(0,0,W,H);
const scale=Math.min(W/800,H/450);
ctx.save();ctx.translate((W-800*scale)/2,(H-450*scale)/2);ctx.scale(scale,scale);
ctx.save();ctx.translate(-camera,0);
for(let x=0;x<2200;x+=170){
ctx.fillStyle=phase===4?"#344b66":"#244b35";
ctx.fillRect(x+40,150,18,235);
circle(x+48,150,55,phase===2?"#57345f":"#286342");
}
for(const p of platforms()){
ctx.fillStyle=phase===4?"#4b7758":"#497c3f";
ctx.fillRect(p.x,p.y,p.w,450-p.y);
ctx.fillStyle="#79ad55";ctx.fillRect(p.x,p.y,p.w,12);
}
if(phase===3){
for(const [a,b] of holes){
ctx.fillStyle="#070e0c";ctx.fillRect(a,385,b-a,100);
}
for(const x of [300,700,1100,1500,1900]){
ctx.fillStyle="#b7e1e8";ctx.fillRect(x,347,48,9);
ctx.fillStyle="#78acc3";ctx.fillRect(x+5,356,38,29);
}
ctx.fillStyle="#f4edba";ctx.font="bold 17px Arial";
ctx.fillText(hero.x<700?"Zovinho: Papai, cuidado com o poço!":hero.x<1400?"Grilo: Pule nos copos!":"Zovinho: Estou seguindo você!",Math.max(camera+10,hero.x-80),180);
}
for(const c of coins)if(!c.taken){
circle(c.x,c.y,12,"#f9d44c");
circle(c.x,c.y,5,"#fff0a1");
}
for(const e of enemies)enemy(e);
ctx.strokeStyle="#c48cff";ctx.lineWidth=9;ctx.beginPath();
ctx.ellipse(2050,330,24,49,0,0,Math.PI*2);ctx.stroke();
if(inv<=0||Math.floor(clock*12)%2===0){
egg(hero.x+16,hero.y+22,24,false,false);
}
if(phase===3)egg(zovinho.x+16,zovinho.y+20,16,true,true);
ctx.restore();ctx.restore();
}
let last=0;
function frame(ms){
const dt=Math.min((ms-last)/1000||0,.032);last=ms;
update(dt);draw();requestAnimationFrame(frame);
}
reset(1);requestAnimationFrame(frame);
</script>
</body>
</html>
