<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>KOSOVO 0.3 — Bolovo 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#83dcff;font-family:system-ui,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;z-index:4;color:#fff;font-weight:900;text-shadow:0 2px 3px #345}
.badge{background:#123b59aa;border:2px solid #fff8;border-radius:14px;padding:8px 11px}
#controls{position:fixed;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));padding:0 18px;display:flex;justify-content:space-between;align-items:end;z-index:5;pointer-events:none}
.pad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px;gap:6px;pointer-events:auto}
button{font:900 15px system-ui}
.btn{width:58px;height:58px;border:2px solid #fff9;border-radius:17px;background:#173d59bb;color:#fff;font-size:24px;box-shadow:0 4px 10px #0004}
.btn:active,#jump:active{transform:scale(.95);background:#236b90}
.empty{visibility:hidden}
#jump{width:82px;height:82px;border:3px solid #fff;border-radius:50%;background:#f19a35e8;color:#fff;box-shadow:0 5px 12px #0005}
#tip{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:4;background:#0008;color:#fff;padding:8px 13px;border-radius:12px;text-align:center;font-size:13px}
#win{display:none;position:fixed;inset:0;z-index:10;background:#000b;color:white;align-items:center;justify-content:center;text-align:center;padding:24px}
#win h1{font-size:32px;margin:0 0 10px}
#restart{padding:13px 18px;border:0;border-radius:13px;background:#f19a35;color:#fff}
</style>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b21b6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KOSOVO">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="badge">🥚 KOSOVO · FASE 1</div><div class="badge">🪙 <span id="coins">0</span> · ❤️ <span id="lives">3</span> · 👑 <span id="bossHp">5</span></div></div>
<div id="tip">Explore, pule e chegue ao portal dourado!</div>
<div id="controls">
  <div class="pad">
    <button class="btn empty"></button><button class="btn" data-k="forward">▲</button><button class="btn empty"></button>
    <button class="btn" data-k="left">◀</button><button class="btn" data-k="back">▼</button><button class="btn" data-k="right">▶</button>
  </div>
  <div style="display:flex;gap:10px;align-items:end"><button id="attack" class="btn" style="border-radius:50%;width:72px;height:72px;background:#7b4ac7dd">ATAQUE</button><button id="jump">PULAR</button></div>
</div>
<div id="win"><div><h1>🏆 Fase 1 concluída!</h1><p>Bolovo derrotou o guardião e chegou ao portal de Kosovo!</p><button id="restart">Jogar novamente</button></div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const root=document.getElementById('game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x83dcff);
scene.fog=new THREE.Fog(0x83dcff,35,125);

const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,250);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(1.7,devicePixelRatio));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
root.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xffffff,0x6ca55c,2.2);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,3.0);sun.position.set(15,35,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);

const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.78});
const grass=mat(0x55bd55), dirt=mat(0x8a5a36), white=mat(0xf7f7f2), dark=mat(0x30251e), hair=mat(0x4a3021), egg=mat(0xf1dcae), gold=mat(0xffcf32), red=mat(0xd95858);

function box(x,y,z,sx,sy,sz,material,shadow=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;scene.add(m);return m;
}
function platform(x,z,w,d,y=0){
 box(x,y-.45,z,w,.9,d,dirt);
 box(x,y+.03,z,w,.16,d,grass);
 return {x,z,w,d,y};
}
const plats=[
 platform(0,0,34,18,0),
 platform(25,-2,12,10,1.2),
 platform(39,4,11,10,2.3),
 platform(53,-4,13,10,1.3),
 platform(69,3,18,13,2.5),
 platform(87,0,18,14,1.2)
];

// Decorative trees
function tree(x,z){
 const g=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.45,.6,3,8),dirt);trunk.position.y=1.5;trunk.castShadow=true;g.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(2.3,12,10),grass);crown.position.y=4.2;crown.castShadow=true;g.add(crown);
 g.position.set(x,0,z);scene.add(g);
}
[-13,-5,7,14,82,92].forEach((x,i)=>tree(x,i%2?6:-7));

// Start sign
const sign=box(-10,2,1,8,3,.25,mat(0xf0c66a),false);
sign.rotation.y=Math.PI; // visual marker
// small letters as colored bars: "BEM VINDO"
for(let i=0;i<5;i++) box(-13+i*1.5,2.1,.82,.8,.15,.08,dark,false);

// Coins
const coins=[];
function addCoin(x,y,z){const m=new THREE.Mesh(new THREE.TorusGeometry(.42,.13,8,18),gold);m.position.set(x,y,z);m.rotation.x=Math.PI/2;m.castShadow=true;scene.add(m);coins.push({m,x,y,z,got:false});}
[[1,1.5,0],[7,1.5,0],[24,3,-2],[39,4.2,4],[53,3,-4],[69,4.3,3],[83,3.1,0]].forEach(v=>addCoin(...v));

// Enemy: original little red blob
const enemies=[];
function addEnemy(x,z,y=1){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.SphereGeometry(.85,14,10),red);body.scale.y=.75;body.castShadow=true;g.add(body);
 const eyeMat=mat(0xffffff),pupil=mat(0x222222);
 for(const sx of [-.28,.28]){const e=new THREE.Mesh(new THREE.SphereGeometry(.2,8,8),eyeMat);e.position.set(sx,.18,.7);g.add(e);const p=new THREE.Mesh(new THREE.SphereGeometry(.08,8,8),pupil);p.position.set(sx,.18,.88);g.add(p)}
 g.position.set(x,y,z);scene.add(g);enemies.push({g,baseX:x,dir:1,range:3});
}
addEnemy(17,0,.85);addEnemy(50,-4,2.15);addEnemy(78,3,3.35);

// Bolovo 3D
const bolovo=new THREE.Group();scene.add(bolovo);
const body=new THREE.Mesh(new THREE.SphereGeometry(1.25,20,16),egg);
body.scale.set(.88,1.15,.88);body.castShadow=true;bolovo.add(body);

// Hair tufts all around
const hairGroup=new THREE.Group();bolovo.add(hairGroup);
for(let i=0;i<38;i++){
 const a=i/38*Math.PI*2;
 for(let layer=0;layer<2;layer++){
  const phi=-.95+layer*.75+(i%4)*.03;
  const r=1.22;
  const tuft=new THREE.Mesh(new THREE.ConeGeometry(.12,.75+(i%3)*.15,7),hair);
  tuft.position.set(Math.cos(a)*Math.cos(phi)*r,Math.sin(phi)*r,Math.sin(a)*Math.cos(phi)*r);
  tuft.lookAt(tuft.position.clone().multiplyScalar(2));
  hairGroup.add(tuft);
 }
}
// Hair curtain down the sides/back
for(let i=0;i<18;i++){
 const x=-1.15+(i%9)*.29, z=-.45-Math.floor(i/9)*.18;
 const tuft=new THREE.Mesh(new THREE.ConeGeometry(.14,.9+(i%4)*.18,7),hair);
 tuft.position.set(x,-.05,z);tuft.rotation.x=Math.PI;
 hairGroup.add(tuft);
}

// face
const glasses=mat(0x242424);
for(const sx of [-.42,.42]){const ring=new THREE.Mesh(new THREE.TorusGeometry(.34,.06,8,18),glasses);ring.position.set(sx,.18,.98);bolovo.add(ring)}
const bridge=new THREE.Mesh(new THREE.BoxGeometry(.28,.07,.07),glasses);bridge.position.set(0,.18,.99);bolovo.add(bridge);
const eye=mat(0x222222);
for(const sx of [-.42,.42]){const e=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),eye);e.position.set(sx,.18,1.02);bolovo.add(e)}
// arms/gloves
function limb(x,rot){
 const a=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,.95,8),egg);a.position.set(x,.05,0);a.rotation.z=rot;a.castShadow=true;bolovo.add(a);
 const g=new THREE.Mesh(new THREE.SphereGeometry(.25,10,8),white);g.position.set(x*1.25,-.32,.02);g.castShadow=true;bolovo.add(g);
}
limb(-1.2,-.75);limb(1.2,.75);
// legs + shoes
for(const sx of [-.45,.45]){
 const leg=new THREE.Mesh(new THREE.CylinderGeometry(.14,.16,.65,8),dark);leg.position.set(sx,-1.35,0);leg.castShadow=true;bolovo.add(leg);
 const shoe=new THREE.Mesh(new THREE.SphereGeometry(.38,12,8),white);shoe.scale.set(1.25,.5,1.7);shoe.position.set(sx,-1.65,.18);shoe.castShadow=true;bolovo.add(shoe);
}
bolovo.position.set(-13,1.9,0);

const state={x:-13,y:1.9,z:0,vy:0,onGround:true,coins:0,lives:3,inv:0,win:false};
const input={left:false,right:false,forward:false,back:false,jump:false};
document.querySelectorAll('[data-k]').forEach(b=>{
 const k=b.dataset.k;
 ['pointerdown','pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();input[k]=ev==='pointerdown'}));
});
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();input.jump=true});
document.getElementById('restart').addEventListener('click',()=>location.reload());

function respawn(){
 state.x=-13;state.y=1.9;state.z=0;state.vy=0;state.onGround=true;state.inv=1.5;
}
function getPlatformAt(x,z){
 for(const p of plats){
  if(x>p.x-p.w/2+.15&&x<p.x+p.w/2-.15&&z>p.z-p.d/2+.15&&z<p.z+p.d/2-.15)return p;
 }
 return null;
}
function update(dt,t){
 if(state.win)return;
 const move=7.5*dt;
 if(input.left)state.x-=move;
 if(input.right)state.x+=move;
 if(input.forward)state.z-=move*.8;
 if(input.back)state.z+=move*.8;
 state.x=Math.max(-16,Math.min(96,state.x));
 if(input.jump&&state.onGround){state.vy=10.5;state.onGround=false}
 input.jump=false;
 state.vy-=24*dt;state.y+=state.vy*dt;
 const p=getPlatformAt(state.x,state.z);
 if(p && state.y<=p.y+1.9 && state.vy<=0){state.y=p.y+1.9;state.vy=0;state.onGround=true}
 else state.onGround=false;
 if(state.y<-5){state.lives--;respawnFromCheckpoint();if(state.lives<=0){state.lives=3;state.coins=0}}
 state.inv=Math.max(0,state.inv-dt);

 coins.forEach(o=>{
  if(!o.got && Math.hypot(state.x-o.x,state.z-o.z)<1.5 && Math.abs(state.y-o.y)<1.5){o.got=true;o.m.visible=false;state.coins++}
  if(!o.got)o.m.rotation.y+=dt*3;
 });
 enemies.forEach(e=>{
  e.g.position.x += e.dir*dt*2;
  if(Math.abs(e.g.position.x-e.baseX)>e.range)e.dir*=-1;
  if(state.inv<=0 && Math.hypot(state.x-e.g.position.x,state.z-e.g.position.z)<1.55 && Math.abs(state.y-e.g.position.y)<2){
   if(state.vy<0 && state.y>e.g.position.y+1){e.g.visible=false;e.dead=true;state.vy=8}
   else {state.lives--;state.inv=2;respawnFromCheckpoint()}
  }
 });
 
 // Activate checkpoints when the player reaches them.
 checkpoints.forEach(cp=>{
   if(!cp.active && Math.hypot(state.x-cp.x,state.z-cp.z)<4){
     cp.active=true;checkpoint={x:cp.x,y:cp.y??1.9,z:cp.z};
     document.getElementById('tip').textContent='⭐ CHECKPOINT ATIVADO!';
     setTimeout(()=>document.getElementById('tip').textContent='Derrote o guardião e chegue ao portal!',1800);
   }
 });
 bolovoAttack();

 // Boss follows Bolovo in the final arena and periodically charges.
 if(boss && !boss.dead){
   const dx=state.x-boss.g.position.x,dz=state.z-boss.g.position.z;
   const dist=Math.hypot(dx,dz);
   boss.attackTimer-=dt;
   if(dist<16){
     boss.g.position.x += Math.sign(dx)*dt*1.4;
     boss.g.position.z += Math.sign(dz)*dt*1.4;
   }
   if(boss.attackTimer<=0 && dist<9){
     state.inv=state.inv; // boss contact handled below
     boss.attackTimer=2.2;
     boss.g.position.x += Math.sign(dx)*1.8;
     boss.g.position.z += Math.sign(dz)*1.8;
   }
   if(state.inv<=0 && dist<2.2){
     state.lives--;state.inv=2;respawnFromCheckpoint();
   }
 }
 if(boss && boss.dead && state.x>94){
   state.win=true;document.getElementById('win').style.display='flex'
 }

 bolovo.position.set(state.x,state.y,state.z);
 // subtle running/breathing animation
 const moving=input.left||input.right||input.forward||input.back;
 bolovo.rotation.z=moving?Math.sin(t*14)*.045:0;
 hairGroup.rotation.y=Math.sin(t*2)*.03;
 const target=new THREE.Vector3(state.x-6, state.y+5.8, state.z+11);
 camera.position.lerp(target,Math.min(1,dt*4));
 camera.lookAt(state.x,state.y+1,state.z);
 document.getElementById('coins').textContent=state.coins;
 document.getElementById('lives').textContent=state.lives;document.getElementById('bossHp').textContent=boss&&!boss.dead?boss.hp:0;
}

// Checkpoint, boss and special enemies

// Golden finish portal
const portal=new THREE.Group();
const tor=new THREE.Mesh(new THREE.TorusGeometry(2.3,.32,12,32),gold);tor.rotation.y=Math.PI/2;portal.add(tor);
const orb=new THREE.Mesh(new THREE.SphereGeometry(1.65,16,12),mat(0xffe98a));orb.material.transparent=true;orb.material.opacity=.55;portal.add(orb);
portal.position.set(96,3.3,0);scene.add(portal);

const checkpoints = [{x:44,z:4,active:false},{x:70,z:3,active:false}];
let checkpoint={x:-13,y:1.9,z:0};
let boss=null;

function addBoss(x,z,y){
 const g=new THREE.Group();
 const b=new THREE.Mesh(new THREE.SphereGeometry(1.65,20,14),mat(0x7a3f91));
 b.scale.y=1.05;b.castShadow=true;g.add(b);
 const horn=mat(0xf4c86a);
 for(const sx of [-.75,.75]){
   const h=new THREE.Mesh(new THREE.ConeGeometry(.22,.8,8),horn);
   h.position.set(sx,1.55,.05);h.rotation.z=sx>0?-.25:.25;g.add(h);
 }
 const em=mat(0xffffff),pm=mat(0x222222);
 for(const sx of [-.52,.52]){
   const e=new THREE.Mesh(new THREE.SphereGeometry(.28,10,8),em);e.position.set(sx,.3,1.35);g.add(e);
   const q=new THREE.Mesh(new THREE.SphereGeometry(.11,8,8),pm);q.position.set(sx,.3,1.58);g.add(q);
 }
 g.position.set(x,y,z);scene.add(g);
 boss={g,x,y,z,hp:5,dir:1,attackTimer:0,dead:false};
}
addBoss(87,0,2.85);

let attackPressed=false;
document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();attackPressed=true});

const originalRespawn=respawn;
function respawnFromCheckpoint(){
 state.x=checkpoint.x;state.y=checkpoint.y;state.z=checkpoint.z;state.vy=0;state.onGround=true;state.inv=1.7;
}
function bolovoAttack(){
 if(!attackPressed)return;
 attackPressed=false;
 // A short-range spinning hitbox around Bolovo.
 const hitRange=2.5;
 for(const e of enemies){
   if(e.dead)continue;
   if(Math.hypot(state.x-e.g.position.x,state.z-e.g.position.z)<hitRange){
     e.dead=true;e.g.visible=false;state.vy=7;
   }
 }
 if(boss && !boss.dead && Math.hypot(state.x-boss.g.position.x,state.z-boss.g.position.z)<3.2){
   boss.hp--;boss.g.scale.setScalar(1+0.05*(5-boss.hp));
   if(boss.hp<=0){boss.dead=true;boss.g.visible=false}
 }
}

const clock=new THREE.Clock();
function loop(){
 const dt=Math.min(.033,clock.getDelta()),t=clock.elapsedTime;
 tor.rotation.z=t*.8;orb.scale.setScalar(1+Math.sin(t*3)*.05);
 update(dt,t);renderer.render(scene,camera);requestAnimationFrame(loop);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
loop();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
